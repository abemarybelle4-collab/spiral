<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪念空间 5.0 - AI 知识库版</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --primary-color: #4f46e5;
            --primary-light: #e0e7ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --highlight-color: #fef08a; /* 荧光笔黄色 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 600px; position: relative; }
        
        /* 顶部用户资料栏 */
        .header-profile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .profile-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #e5e7eb; border: 2px solid var(--primary-light); }
        .profile-text { display: flex; flex-direction: column; }
        .username { font-weight: bold; font-size: 15px; color: var(--text-main); }
        .bio { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .app-title { font-size: 18px; font-weight: 800; color: var(--primary-color); margin: 0; }

        .main-trigger-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            margin-bottom: 20px;
        }
        .input-panel {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .media-container {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #fafafa;
            padding: 12px;
            margin-bottom: 12px;
        }
        .editor-area {
            width: 100%;
            min-height: 140px;
            max-height: 300px;
            border: none;
            background: transparent;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            overflow-y: auto;
            word-break: break-all;
        }
        .editor-area[placeholder]:empty:before { content: attr(placeholder); color: #9ca3af; cursor: text; }
        
        /* 富文本工具栏 */
        .toolbar { display: flex; flex-wrap: wrap; gap: 6px; background: #f3f4f6; padding: 6px; border-radius: 8px; margin-bottom: 12px; align-items: center;}
        .tool-btn { background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 2px;}
        .tool-btn:hover { background: #f9fafb; }
        
        /* AI 对象选择面板 */
        .ai-selector-panel { display: none; background: #f0fdf4; border: 1px dashed #bbf7d0; padding: 10px; border-radius: 10px; margin-bottom: 12px; }
        .ai-title { font-size: 12px; font-weight: bold; color: #166534; margin-bottom: 6px; }
        .ai-options { display: flex; gap: 6px; flex-wrap: wrap; }
        .ai-opt { padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; background: #fff; border: 1px solid #dcfce7; }
        .ai-opt.active { background: #16a34a; color: white; border-color: #16a34a; }

        .meta-inputs { display: flex; gap: 10px; margin-bottom: 12px; }
        .meta-inputs input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; outline: none; }
        .input-methods-bar { display: flex; gap: 8px; margin-bottom: 12px; }
        .method-btn { flex: 1; padding: 10px; font-size: 13px; border: 1px solid var(--border-color); border-radius: 10px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; }
        .method-btn.active-record { background-color: #ef4444; color: white; border-color: #ef4444; animation: pulse 1.5s infinite; }
        
        .tag-selector { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .tag-option { padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-color); background: #fff; white-space: nowrap; }
        .tag-option.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .btn-submit-save { width: 100%; background-color: #10b981; color: white; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold; border: none; cursor: pointer; }
        
        .image-preview-slot { display: none; margin-top: 12px; position: relative; }
        .image-preview-slot img { max-width: 100%; max-height: 150px; border-radius: 8px; object-fit: cover; }
        .remove-img-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }

        /* 检索与列表 */
        .search-box { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; box-sizing: border-box; font-size: 14px; margin-bottom: 12px; }
        .category-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; overflow-x: auto; margin-bottom: 16px;}
        .tab { padding: 6px 12px; font-size: 14px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; }
        .tab.active { color: var(--primary-color); font-weight: bold; border-bottom-color: var(--primary-color); }
        
        .notes-list { display: flex; flex-direction: column; gap: 14px; }
        
        /* 便签卡片样式 */
        .note-card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.01); position: relative; border-top: 4px solid var(--primary-color); transition: all 0.2s; }
        .note-card.pinned { border-left: 4px solid #ef4444; background: #fffafb; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.05); }
        .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-right: 24px;}
        .note-time { font-size: 12px; color: var(--text-muted); }
        .note-tags-wrapper { display: flex; gap: 6px; align-items: center; }
        .note-tag { font-size: 11px; padding: 3px 8px; border-radius: 8px; font-weight: bold; }
        .note-ai-tag { font-size: 11px; padding: 3px 6px; border-radius: 6px; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; font-weight: 500;}
        .note-meta-line { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 8px; }
        .note-content { font-size: 15px; line-height: 1.6; word-break: break-all; }
        .note-img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        
        /* 📌 置顶图章按钮 */
        .pin-btn-icon { position: absolute; top: 14px; right: 14px; background: none; border: none; cursor: pointer; font-size: 16px; color: #d1d5db; padding: 2px; transition: color 0.2s;}
        .pin-btn-icon.is-pinned { color: #ef4444; }
        .card-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; border-top: 1px solid #f3f4f6; padding-top: 8px; }
        .action-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; }

        /* 生词标注样式 */
        .vocab-tooltip { color: #2563eb; font-weight: 600; text-decoration: underline dashed #2563eb; cursor: help; position: relative; display: inline-block; }
        
        /* 弹窗弹层样式 (通用 Modal) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; animation: fadeIn 0.2s ease;}
        .modal-card { background: white; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-card h3 { margin-top: 0; color: var(--text-main); margin-bottom: 14px;}
        .modal-card input, .modal-card textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; outline: none; font-size: 14px;}
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; }
        .modal-btn.cancel { background: #f3f4f6; color: var(--text-muted); }
        .modal-btn.confirm { background: var(--primary-color); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); opacity: 0.8; } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-profile">
            <div class="profile-info" id="profileTrigger">
                <img id="userAvatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a5b4fc'><circle cx='12' cy='8' r='4'/><path d='M12 14c-6.1 0-11 2.9-11 6v1h22v-1c0-3.1-4.9-6-11-6z'/></svg>" alt="头像">
                <div class="profile-text">
                    <span id="lblUsername" class="username">灵感探索者</span>
                    <span id="lblBio" class="bio">点击配置个性签名...</span>
                </div>
            </div>
            <h2 class="app-title">闪念空间 5.0</h2>
        </div>

        <button id="mainTriggerBtn" class="main-trigger-btn">➕ 记录新想法</button>
        
        <div id="inputPanel" class="input-panel">
            <div class="toolbar">
                <button class="tool-btn" data-cmd="bold">B</button>
                <button class="tool-btn" data-cmd="italic" style="font-style: italic;">I</button>
                <button class="tool-btn" data-cmd="underline" style="text-decoration: underline;">U</button>
                <button class="tool-btn" id="toolHighlight" title="荧光笔重点">🖍️ 荧光笔</button>
                <button class="tool-btn" id="toolVocab" title="选中文本添加生词标注">🏷️ 生词释义</button>
            </div>

            <div class="ai-selector-panel" id="aiSelectorPanel">
                <div class="ai-title">🤖 复制自哪个 AI 模型的对话？</div>
                <div class="ai-options" id="aiOptions">
                    <span class="ai-opt active" data-model="Gemini">Gemini</span>
                    <span class="ai-opt" data-model="ChatGPT">ChatGPT</span>
                    <span class="ai-opt" data-model="Claude">Claude</span>
                    <span class="ai-opt" data-model="DeepSeek">DeepSeek</span>
                    <span class="ai-opt" data-model="其他">其他模型</span>
                </div>
            </div>

            <div class="media-container">
                <div id="noteInput" class="editor-area" contenteditable="true" placeholder="在这里粘贴大模型对话或心得，选中文词可使用上方[荧光笔]或[生词释义]功能..."></div>
                <div id="imagePreviewSlot" class="image-preview-slot">
                    <img id="previewImg" src="" alt="预览图">
                    <button class="remove-img-btn" id="removeImgBtn">×</button>
                </div>
            </div>

            <div class="meta-inputs">
                <input type="datetime-local" id="metaTime" title="时间">
                <input type="text" id="metaLocation" placeholder="📍 标记场景/地点（可选）">
            </div>

            <div class="input-methods-bar">
                <button id="recordBtn" class="method-btn">🎤 语音输入识别</button>
                <button id="photoBtn" class="method-btn">🖼️ 附带截图/照片</button>
                <input type="file" id="hiddenFileInput" accept="image/*" style="display: none;">
            </div>

            <div class="tag-selector" id="tagSelector">
                <span class="tag-option active" data-tag="📚 读书笔记">📚 读书笔记</span>
                <span class="tag-option" data-tag="💡 即时灵感">💡 即时灵感</span>
                <span class="tag-option" data-tag="🤝 交谈心得">🤝 交谈心得</span>
                <span class="tag-option" data-tag="📸 照片收集">📸 照片收集</span>
            </div>

            <button id="saveBtn" class="btn-submit-save">确定存入多维库</button>
        </div>

        <div style="margin-bottom: 16px;">
            <input type="text" id="searchBox" class="search-box" placeholder="🔍 检索关键词、AI名称或生涩词汇...">
            <div class="category-tabs" id="categoryTabs">
                <div class="tab active" data-filter="全部">全部内容</div>
                <div class="tab" data-filter="📚 读书笔记">读书笔记</div>
                <div class="tab" data-filter="💡 即时灵感">即时灵感</div>
                <div class="tab" data-filter="🤝 交谈心得">交谈心得</div>
                <div class="tab" data-filter="📸 照片收集">照片收集</div>
            </div>
        </div>

        <div id="notesList" class="notes-list"></div>
    </div>

    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <h3>个人资料配置</h3>
            <label style="font-size:12px; color:var(--text-muted);">点击下方更换头像：</label>
            <input type="file" id="avatarFileInput" accept="image/*" style="margin-top:4px; margin-bottom:12px;">
            <input type="text" id="inputUsername" placeholder="修改你的昵称">
            <textarea id="inputBio" rows="2" placeholder="写一句炫酷的个性签名吧..."></textarea>
            <div class="modal-btns">
                <button class="modal-btn cancel" id="btnCancelProfile">取消</button>
                <button class="modal-btn confirm" id="btnSaveProfile">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="vocabModal">
        <div class="modal-card">
            <h3>添加生词/生涩短语解释</h3>
            <p id="vocabSelectedText" style="font-size:14px; font-weight:bold; color:var(--primary-color); margin-bottom:8px; background:#f0fdfa; padding:6px; border-radius:4px;"></p>
            <textarea id="inputVocabMean" rows="3" placeholder="请输入针对该词汇的白话文解释、标注或关联超链接..."></textarea>
            <div class="modal-btns">
                <button class="modal-btn cancel" id="btnCancelVocab">取消</button>
                <button class="modal-btn confirm" id="btnSaveVocab">确定绑定标注</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 初始化变量与缓存读取 ---
        let notes = JSON.parse(localStorage.getItem('spark_space_v5')) || [];
        let profile = JSON.parse(localStorage.getItem('spark_profile_v5')) || {
            username: "灵感探索者",
            bio: "专注收集大模型智慧与深度思考...",
            avatar: ""
        };
        let selectedTag = '📚 读书笔记';
        let selectedAIModel = 'Gemini';
        let currentFilter = '全部';
        let searchQuery = '';

        // --- 2. 加载个人资料 ---
        function loadProfile() {
            document.getElementById('lblUsername').textContent = profile.username;
            document.getElementById('lblBio').textContent = profile.bio;
            if (profile.avatar) document.getElementById('userAvatar').src = profile.avatar;
        }
        loadProfile();

        // 个人资料修改弹窗逻辑
        const profileTrigger = document.getElementById('profileTrigger');
        const profileModal = document.getElementById('profileModal');
        profileTrigger.addEventListener('click', () => {
            document.getElementById('inputUsername').value = profile.username;
            document.getElementById('inputBio').value = profile.bio;
            profileModal.style.display = 'flex';
        });
        document.getElementById('btnCancelProfile').addEventListener('click', () => profileModal.style.display = 'none');
        document.getElementById('btnSaveProfile').addEventListener('click', () => {
            profile.username = document.getElementById('inputUsername').value.trim() || "匿名探索者";
            profile.bio = document.getElementById('inputBio').value.trim() || "这个人很懒，什么都没写~";
            
            const avatarFile = document.getElementById('avatarFileInput').files[0];
            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    profile.avatar = e.target.result;
                    localStorage.setItem('spark_profile_v5', JSON.stringify(profile));
                    loadProfile();
                    profileModal.style.display = 'none';
                };
                reader.readAsDataURL(avatarFile);
            } else {
                localStorage.setItem('spark_profile_v5', JSON.stringify(profile));
                loadProfile();
                profileModal.style.display = 'none';
            }
        });

        // --- 3. 面板与标签切换控制 ---
        const mainTriggerBtn = document.getElementById('mainTriggerBtn');
        const inputPanel = document.getElementById('inputPanel');
        const aiSelectorPanel = document.getElementById('aiSelectorPanel');
        const metaTime = document.getElementById('metaTime');

        mainTriggerBtn.addEventListener('click', () => {
            if (inputPanel.style.display === 'block') {
                inputPanel.style.display = 'none';
                mainTriggerBtn.textContent = '➕ 记录新想法';
            } else {
                inputPanel.style.display = 'block';
                mainTriggerBtn.textContent = '❌ 关闭输入面板';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                metaTime.value = now.toISOString().slice(0, 16);
            }
        });

        const tagOptions = document.querySelectorAll('.tag-option');
        tagOptions.forEach(option => {
            option.addEventListener('click', () => {
                tagOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                selectedTag = option.getAttribute('data-tag');
                // 如果是交谈心得，展露AI对象选择
                aiSelectorPanel.style.display = (selectedTag === '🤝 交谈心得') ? 'block' : 'none';
            });
        });

        const aiOpts = document.querySelectorAll('.ai-opt');
        aiOpts.forEach(opt => {
            opt.addEventListener('click', () => {
                aiOpts.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedAIModel = opt.getAttribute('data-model');
            });
        });

        // --- 4. 荧光笔与生词标注富文本逻辑 ---
        const noteInput = document.getElementById('noteInput');
        
        document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.execCommand(btn.getAttribute('data-cmd'), false, null);
                noteInput.focus();
            });
        });

        // 荧光笔逻辑
        document.getElementById('toolHighlight').addEventListener('click', (e) => {
            e.preventDefault();
            const selection = window.getSelection();
            if (selection.rangeCount > 0 && selection.toString().trim() !== "") {
                document.execCommand('hiliteColor', false, varColor('--highlight-color', '#fef08a'));
            } else {
                alert('请先用手指或鼠标选中一段笔记文字，再戳荧光笔哦！');
            }
            noteInput.focus();
        });
        function varColor(varName, fallback) {
            return fallback; // 快捷色彩降级处理
        }

        // 生词微型标注系统
        let savedRange = null;
        const vocabModal = document.getElementById('vocabModal');
        document.getElementById('toolVocab').addEventListener('click', (e) => {
            e.preventDefault();
            const selection = window.getSelection();
            if (selection.rangeCount > 0 && selection.toString().trim() !== "") {
                savedRange = selection.getRangeAt(0).cloneRange();
                document.getElementById('vocabSelectedText').textContent = "选中的词汇: " + selection.toString();
                document.getElementById('inputVocabMean').value = "";
                vocabModal.style.display = 'flex';
            } else {
                alert('请先选中一段你不懂的生涩词汇或概念短语！');
            }
        });
        document.getElementById('btnCancelVocab').addEventListener('click', () => vocabModal.style.display = 'none');
        document.getElementById('btnSaveVocab').addEventListener('click', () => {
            const mean = document.getElementById('inputVocabMean').value.trim();
            if (!mean) return alert('请输入解释标注内容~');
            
            if (savedRange) {
                const span = document.createElement('span');
                span.className = 'vocab-tooltip';
                span.setAttribute('data-tip', mean);
                span.setAttribute('onclick', 'toggleTooltip(this, event)');
                span.appendChild(document.createTextNode(savedRange.toString()));
                
                savedRange.deleteContents();
                savedRange.insertNode(span);
                vocabModal.style.display = 'none';
                window.getSelection().removeAllRanges();
            }
        });

        // 移动端和网页端戳生词展现标注气泡逻辑
        window.toggleTooltip = function(element, event) {
            event.stopPropagation();
            const tipText = element.getAttribute('data-tip');
            alert("💡 专属标注释义:\n" + tipText);
        };

        // --- 5. 语音识别与图片逻辑 ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null; let isRecording = false;
        const recordBtn = document.getElementById('recordBtn');
        if (SpeechRecognition) {
            recognition = new SpeechRecognition(); recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'zh-CN';
            recognition.onresult = (event) => {
                let resultText = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) { resultText += event.results[i][0].transcript; }
                if(resultText.trim()) { noteInput.innerHTML += resultText; }
            };
            recognition.onerror = () => stopRecording(); recognition.onend = () => { if (isRecording) stopRecording(); };
        }
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                isRecording = true; recordBtn.textContent = '🛑 正在录音...'; recordBtn.classList.add('active-record');
                if(recognition) recognition.start();
            } else { stopRecording(); }
        });
        function stopRecording() { isRecording = false; recordBtn.textContent = '🎤 语音输入识别'; recordBtn.classList.remove('active-record'); if(recognition) recognition.stop(); }

        const photoBtn = document.getElementById('photoBtn');
        const hiddenFileInput = document.getElementById('hiddenFileInput');
        const imagePreviewSlot = document.getElementById('imagePreviewSlot');
        let currentImageData = "";
        photoBtn.addEventListener('click', () => hiddenFileInput.click());
        hiddenFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageData = event.target.result;
                    document.getElementById('previewImg').src = currentImageData;
                    imagePreviewSlot.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        document.getElementById('removeImgBtn').addEventListener('click', () => { currentImageData = ""; imagePreviewSlot.style.display = 'none'; hiddenFileInput.value = ""; });

        // --- 6. 数据存入与渲染逻辑 ---
        document.getElementById('saveBtn').addEventListener('click', () => {
            const htmlContent = noteInput.innerHTML.trim();
            const hasText = noteInput.textContent.trim().length > 0;
            if (!hasText && !currentImageData) return alert('写点大模型语录或者灵感再保存吧~');

            let finalTime = new Date().toLocaleString('zh-CN', { hour12: false });
            if(metaTime.value) { finalTime = new Date(metaTime.value).toLocaleString('zh-CN', { hour12: false }); }

            const newNote = {
                id: Date.now(),
                content: htmlContent,
                image: currentImageData,
                tag: selectedTag,
                aiModel: (selectedTag === '🤝 交谈心得') ? selectedAIModel : '',
                time: finalTime,
                location: document.getElementById('metaLocation').value.trim(),
                isPinned: false // 默认不置顶
            };

            notes.unshift(newNote);
            saveNotesToStorage();
            
            // 重置输入状态
            noteInput.innerHTML = ''; currentImageData = ""; imagePreviewSlot.style.display = 'none';
            document.getElementById('metaLocation').value = ''; if(isRecording) stopRecording();
            inputPanel.style.display = 'none'; mainTriggerBtn.textContent = '➕ 记录新想法';
            renderNotes();
        });

        function saveNotesToStorage() {
            localStorage.setItem('spark_space_v5', JSON.stringify(notes));
        }

        // 搜索与检索流
        document.getElementById('searchBox').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderNotes(); });
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active')); tab.classList.add('active');
                currentFilter = tab.getAttribute('data-filter'); renderNotes();
            });
        });

        function renderNotes() {
            const notesList = document.getElementById('notesList');
            notesList.innerHTML = '';

            // 过滤笔记
            let filtered = notes.filter(note => {
                const matchesTab = (currentFilter === '全部') || note.tag.includes(currentFilter.slice(2));
                const plainText = note.content.replace(/<[^>]*>/g, '').toLowerCase();
                const aiModelText = note.aiModel ? note.aiModel.toLowerCase() : '';
                const matchesSearch = plainText.includes(searchQuery) || aiModelText.includes(searchQuery);
                return matchesTab && matchesSearch;
            });

            // 排序逻辑：置顶的卡片永远排在最上面！
            filtered.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

            const colors = { '读书': '#4f46e5', '即时': '#f59e0b', '照片': '#10b981', '交谈': '#ec4899' };
            const bgColors = { '读书': '#e0e7ff', '即时': '#fef3c7', '照片': '#d1fae5', '交谈': '#fce7f3' };

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = `note-card ${note.isPinned ? 'pinned' : ''}`;
                const key = note.tag.slice(2, 4);
                card.style.borderTopColor = colors[key] || '#4f46e5';

                let locHtml = note.location ? `<span>📍 ${note.location}</span>` : '';
                let imgHtml = note.image ? `<img src="${note.image}" class="note-img">` : '';
                let aiTagHtml = note.aiModel ? `<span class="note-ai-tag">🤖 ${note.aiModel}</span>` : '';

                card.innerHTML = `
                    <button class="pin-btn-icon ${note.isPinned ? 'is-pinned' : ''}" onclick="togglePin(${note.id})" title="${note.isPinned ? '取消置顶' : '强行置顶卡片'}">📌</button>
                    <div class="note-header">
                        <span class="note-time">${note.time}</span>
                        <div class="note-tags-wrapper">
                            ${aiTagHtml}
                            <span class="note-tag" style="background:${bgColors[key]}; color:${colors[key]}">${note.tag}</span>
                        </div>
                    </div>
                    <div class="note-meta-line">${locHtml}</div>
                    <div class="note-content">${note.content}</div>
                    ${imgHtml}
                    <div class="card-actions">
                        <button class="action-icon" onclick="copyCardText(this)">📋 复制文本</button>
                        <button class="action-icon" onclick="deleteNote(${note.id})" style="color:#ef4444;">🗑️ 删除</button>
                    </div>
                `;
                notesList.appendChild(card);
            });
        }

        // 置顶状态切换
        window.togglePin = function(id) {
            const target = notes.find(n => n.id === id);
            if (target) {
                target.isPinned = !target.isPinned;
                saveNotesToStorage();
                renderNotes();
            }
        };

        window.copyCardText = function(btn) {
            const card = btn.closest('.note-card');
            const contentDiv = card.querySelector('.note-content');
            const text = contentDiv.textContent || contentDiv.innerText;
            navigator.clipboard.writeText(text).then(() => { alert('复制成功！已自动过滤网页格式代码，可直接粘贴发送。'); });
        };

        window.deleteNote = function(id) {
            if(confirm('确定要彻底删除这条珍贵的多维记录吗？')) {
                notes = notes.filter(note => note.id !== id);
                saveNotesToStorage();
                renderNotes();
            }
        };

        renderNotes();
    </script>
</body>
</html>
